<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Dokumentacija API Knjižnica</title>
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.18.3/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
  </style>
</head>
<body>

<div id="swagger-ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.18.3/swagger-ui-bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.18.3/swagger-ui-standalone-preset.js"></script>
<script>
window.onload = function() {
  const spec = {
    "openapi": "3.0.3",
    "info": {
      "title": "API Knjižnica",
      "description": "REST API za upravljanje knjižničnih knjig, članov, izposoj ter šifrantov po posodobljeni bazi z uveljavljenimi pravili glede statusov.",
      "version": "2.2.0"
    },
    "paths": {
      "/api/knjige": {
        "get": {
          "summary": "Iskalnik in pregled knjig",
          "description": "Pridobivanje seznama knjig z opcijskim filtriranjem po ISBN, naslovu ali statusu.",
          "parameters": [
            {
              "name": "isbn",
              "in": "query",
              "required": false,
              "schema": { "type": "string" }
            },
            {
              "name": "naslov",
              "in": "query",
              "required": false,
              "schema": { "type": "string" }
            },
            {
              "name": "status_knjige",
              "in": "query",
              "required": false,
              "schema": { "type": "integer", "format": "int32" }
            }
          ],
          "responses": {
            "200": {
              "description": "Uspešno pridobljen seznam knjig.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/Knjiga" }
                  }
                }
              }
            }
          }
        },
        "post": {
          "summary": "Vnos nove knjige",
          "description": "Dodajanje nove knjige v tabelo knjige. Dovoljen status je samo 1 (na voljo) ali 3 (ni na voljo).",
          "requestBody": {
            "required": true,
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/NovaKnjiga" }
              }
            }
          },
          "responses": {
            "201": {
              "description": "Knjiga uspešno dodana.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/Knjiga" }
                  }
                }
              }
            }
          }
        }
      },
      "/api/knjige/{id}": {
        "put": {
          "summary": "Posodobitev podatkov knjige",
          "description": "Posodobitev podatkov obstoječe knjige. Polje status_knjige se lahko nastavi le na 3 (ni na voljo) ali pa se izpusti / pusti prazno (null), da status ostane nespremenjen.",
          "parameters": [
            {
              "name": "id",
              "in": "path",
              "required": true,
              "schema": { "type": "integer", "format": "int64" }
            }
          ],
          "requestBody": {
            "required": true,
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/PosodobitevKnjiga" }
              }
            }
          },
          "responses": {
            "200": { "description": "Podatki o knjigi uspešno posodobljeni." },
            "400": { "description": "Neveljavni podatki ali nedovoljen status." },
            "404": { "description": "Knjiga ni bila najdena." }
          }
        }
      },
      "/api/clani": {
        "get": {
          "summary": "Pregled članov knjižnice",
          "responses": {
            "200": {
              "description": "Seznam vseh članov.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/Clan" }
                  }
                }
              }
            }
          }
        },
        "post": {
          "summary": "Vnos novega člana",
          "requestBody": {
            "required": true,
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/NovClan" }
              }
            }
          },
          "responses": {
            "201": {
              "description": "Član uspešno dodan.",
              "content": {
                "application/json": {
                  "schema": { "$ref": "#/components/schemas/Clan" }
                }
              }
            }
          }
        }
      },
      "/api/izposoje/izposodi": {
        "post": {
          "summary": "Izposoja knjige (SP_izposoja)",
          "description": "Izvede transakcijo izposoje za določeno knjigo in člana.",
          "requestBody": {
            "required": true,
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ZahtevaIzposoja" }
              }
            }
          },
          "responses": {
            "200": { "description": "Izposoja uspešno zabeležena." },
            "400": { "description": "Knjiga ni na voljo za izposojo ali pa so podatki neveljavni." }
          }
        }
      },
      "/api/izposoje/vrni": {
        "post": {
          "summary": "Vračilo knjige (SP_vracilo)",
          "description": "Izvede transakcijo vračila za določeno knjigo.",
          "requestBody": {
            "required": true,
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ZahtevaVracilo" }
              }
            }
          },
          "responses": {
            "200": { "description": "Vračilo uspešno zabeleženo." },
            "400": { "description": "Za navedeno knjigo ni bila najdena aktivna izposoja." }
          }
        }
      },
      "/api/pregled": {
        "get": {
          "summary": "Pregled stanja knjig (SQL View pregled)",
          "description": "Vrne agregiran pregled knjig skupaj z njihovim statusom, žanrom, datumom izposoje, dni izposoje ter podatki o članu.",
          "responses": {
            "200": {
              "description": "Uspešno pridobljeni podatki iz pogleda pregled.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/PregledVrstica" }
                  }
                }
              }
            }
          }
        }
      },
      "/api/izposoje/log": {
        "get": {
          "summary": "Pregled revizijske sledi (log_izposoje)",
          "parameters": [
            {
              "name": "knjiga_id",
              "in": "query",
              "required": false,
              "schema": { "type": "integer", "format": "int64" }
            },
            {
              "name": "clan_id",
              "in": "query",
              "required": false,
              "schema": { "type": "integer", "format": "int64" }
            }
          ],
          "responses": {
            "200": {
              "description": "Seznam revizijskih zapisov.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/LogIzposoje" }
                  }
                }
              }
            }
          }
        }
      },
      "/api/sifrant/statusi": {
        "get": {
          "summary": "Šifrant statusov",
          "responses": {
            "200": {
              "description": "Seznam statusov.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/StatusKnjige" }
                  }
                }
              }
            }
          }
        }
      },
      "/api/sifrant/zanri": {
        "get": {
          "summary": "Šifrant žanrov",
          "responses": {
            "200": {
              "description": "Seznam žanrov.",
              "content": {
                "application/json": {
                  "schema": {
                    "type": "array",
                    "items": { "$ref": "#/components/schemas/ZanrKnjige" }
                  }
                }
              }
            }
          }
        }
      }
    },
    "components": {
      "schemas": {
        "NovaKnjiga": {
          "type": "object",
          "required": ["isbn", "avtor", "naslov"],
          "properties": {
            "isbn": { "type": "string", "maxLength": 13, "example": "9789610123456" },
            "avtor": { "type": "string", "example": "Ivan Cankar" },
            "naslov": { "type": "string", "example": "Hlapci" },
            "zanr_id": { "type": "integer", "format": "int32", "nullable": true, "example": 1 },
            "status_knjige": {
              "type": "integer",
              "format": "int32",
              "enum": [1, 3],
              "default": 1,
              "description": "Dovoljene vrednosti: 1 (na voljo) ali 3 (ni na voljo).",
              "example": 1
            }
          }
        },
        "PosodobitevKnjiga": {
          "type": "object",
          "required": ["isbn", "avtor", "naslov"],
          "properties": {
            "isbn": { "type": "string", "maxLength": 13, "example": "9789610123456" },
            "avtor": { "type": "string", "example": "Ivan Cankar" },
            "naslov": { "type": "string", "example": "Hlapci" },
            "zanr_id": { "type": "integer", "format": "int32", "nullable": true, "example": 1 },
            "status_knjige": {
              "type": "integer",
              "format": "int32",
              "enum": [3],
              "nullable": true,
              "description": "Opcijsko polje. Dovoljena vrednost je samo 3 (ni na voljo). Če se izpusti ali pošlje null, status v bazi ostane nespremenjen.",
              "example": 3
            }
          }
        },
        "Knjiga": {
          "type": "object",
          "properties": {
            "id": { "type": "integer", "format": "int64", "example": 1 },
            "isbn": { "type": "string", "example": "9789610123456" },
            "avtor": { "type": "string", "example": "Ivan Cankar" },
            "naslov": { "type": "string", "example": "Hlapci" },
            "zanr_id": { "type": "integer", "format": "int32", "nullable": true, "example": 1 },
            "status_knjige": { "type": "integer", "format": "int32", "example": 1 }
          }
        },
        "NovClan": {
          "type": "object",
          "required": ["ime", "priimek"],
          "properties": {
            "ime": { "type": "string", "maxLength": 50, "example": "Janez" },
            "priimek": { "type": "string", "maxLength": 50, "example": "Novak" },
            "naslov": { "type": "string", "nullable": true, "example": "Ljubljanska 1, Maribor" },
            "telefon": { "type": "string", "maxLength": 50, "nullable": true, "example": "041-999-000" }
          }
        },
        "Clan": {
          "type": "object",
          "properties": {
            "id": { "type": "integer", "format": "int64", "example": 1 },
            "ime": { "type": "string", "example": "Janez" },
            "priimek": { "type": "string", "example": "Novak" },
            "naslov": { "type": "string", "nullable": true, "example": "Ljubljanska 1, Maribor" },
            "telefon": { "type": "string", "nullable": true, "example": "041-999-000" }
          }
        },
        "ZahtevaIzposoja": {
          "type": "object",
          "required": ["id_knjige", "id_clana"],
          "properties": {
            "id_knjige": { "type": "integer", "format": "int32", "example": 1 },
            "id_clana": { "type": "integer", "format": "int32", "example": 1 }
          }
        },
        "ZahtevaVracilo": {
          "type": "object",
          "required": ["id_knjige"],
          "properties": {
            "id_knjige": { "type": "integer", "format": "int32", "example": 1 }
          }
        },
        "PregledVrstica": {
          "type": "object",
          "properties": {
            "id": { "type": "integer", "format": "int64", "example": 1 },
            "isbn": { "type": "string", "example": "9789610123456" },
            "avtor": { "type": "string", "example": "Ivan Cankar" },
            "naslov": { "type": "string", "example": "Hlapci" },
            "zanr": { "type": "string", "example": "roman" },
            "status_knjige": { "type": "string", "example": "na voljo" },
            "datum_izposoje": { "type": "string", "example": "06.10.2026" },
            "dni_izposoje": { "type": "string", "example": "5" },
            "clan_id": { "type": "string", "example": "1" },
            "clan": { "type": "string", "example": "Dragan Jovanovic" }
          }
        },
        "LogIzposoje": {
          "type": "object",
          "properties": {
            "cas": { "type": "string", "format": "date-time", "example": "2026-10-06T20:50:33.000Z" },
            "akcija": { "type": "string", "example": "INSERT" },
            "izposoja_id": { "type": "integer", "format": "int64", "example": 1 },
            "knjiga_id": { "type": "integer", "format": "int64", "example": 1 },
            "clan_id": { "type": "integer", "format": "int64", "example": 1 },
            "datum_izposoje": { "type": "string", "format": "date", "example": "2026-10-06" },
            "datum_vracila": { "type": "string", "format": "date", "nullable": true, "example": null },
            "naslov_knjige": { "type": "string", "nullable": true, "example": "Hlapci" },
            "naziv_clana": { "type": "string", "nullable": true, "example": "Dragan Jovanovic" },
            "naslov_clana": { "type": "string", "nullable": true, "example": "Sadjarska 50 Race" },
            "uporabnik": { "type": "string", "nullable": true, "example": "USER PLACEHOLDER" }
          }
        },
        "StatusKnjige": {
          "type": "object",
          "properties": {
            "id": { "type": "integer", "format": "int32", "example": 1 },
            "naziv": { "type": "string", "example": "na voljo" },
            "za_izposojo": { "type": "boolean", "nullable": true, "example": true },
            "za_vracilo": { "type": "boolean", "nullable": true, "example": false }
          }
        },
        "ZanrKnjige": {
          "type": "object",
          "properties": {
            "id": { "type": "integer", "format": "int32", "example": 1 },
            "naziv": { "type": "string", "example": "roman" }
          }
        }
      }
    }
  };

  const ui = SwaggerUIBundle({
    spec: spec,
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIStandalonePreset
    ],
    plugins: [
      SwaggerUIBundle.plugins.DownloadUrl
    ],
    layout: "BaseLayout"
  });

  window.ui = ui;
};
</script>
</body>
</html>
